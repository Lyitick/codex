[tool.poetry]
name = "finance-bot"
version = "0.1.0"
description = "Telegram finance assistant bot with aiogram, SQLite, and FSM"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{ include = "bot" }]

[tool.poetry.dependencies]
python = "^3.10"
aiogram = "^3.5.0"
SQLAlchemy = "^2.0.25"
python-dotenv = "^1.0.1"
alembic = "^1.13.1"
aiosqlite = "^0.20.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
pytest-asyncio = "^0.23.2"
pytest-cov = "^4.1.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
